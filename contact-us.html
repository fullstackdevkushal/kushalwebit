<div class="container-fluid contact-section">

    <!-- Contact Header -->
    <div class="contact-header">
        <h2><b>Contact</b></h2>
    </div>

    <!-- Contact Main -->
    <div class="container-fluid contact-main">

        <!-- Left Side -->
        <div class="main1">

            <div class="main-info">
                <h4><b>📍 Address</b></h4>
                <p>C-152 Murlipura, Jaipur, Rajasthan 302039</p>
            </div>

            <div class="main-info">
                <h4><b>📞 Call Us</b></h4>
                <p>+918852875370</p>
            </div>

            <div class="main-info">
                <h4><b>✉️ Email Us</b></h4>
                <p>www.example.com</p>
            </div>

            <div class="location">
                <iframe
                    src="https://www.google.com/maps?q=Vedh+Ji+Ka+Churaha,+Murlipura,+Jaipur,+Rajasthan&output=embed"
                    frameborder="0"
                    allowfullscreen>
                </iframe>
            </div>

        </div>


        <!-- Right Side -->
        <div class="main2">

            <form action="">

                <!-- Name & Email -->
                <div class="form">

                    <div class="form-1">
                        <label for="name">
                            <b>Your Name</b>
                        </label>
                        <input
                            id="name"
                            class="forminput1"
                            type="text">
                    </div>

                    <div class="form-2">
                        <label for="email">
                            <b>Your Email</b>
                        </label>
                        <input
                            id="email"
                            class="forminput1"
                            type="email">
                    </div>

                </div>


                <!-- Subject -->
                <div class="form3">

                    <label for="subject">
                        <b>Subject</b>
                    </label>

                    <input
                        id="subject"
                        class="forminput2"
                        type="text">

                </div>


                <!-- Message -->
                <div class="form4">

                    <label for="message">
                        <b>Message</b>
                    </label>

                    <textarea
                        id="message"
                        class="textarea"
                        rows="10">
                    </textarea>

                    <button
                        type="submit"
                        class="formbtn">
                        <b>Send Message</b>
                    </button>

                </div>

            </form>

        </div>

    </div>
